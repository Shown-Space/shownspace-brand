# Rebuilds the style guide from tokens on every push to main and deploys it to
# GitHub Pages — so the visible brand page can never drift from the code.
name: Deploy style guide

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build style guide from tokens
        run: npm run build:styleguide
      - uses: actions/upload-pages-artifact@v3
        with:
          path: styleguide
      - id: deploy
        uses: actions/deploy-pages@v4
